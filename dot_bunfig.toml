# ~/.bunfig.toml — managed by chezmoi (dot_bunfig.toml).
# Supply-chain hardening. Verified against bun 1.3.14.
#
# bun already refuses to run dependency lifecycle scripts by default, so this
# changes nothing today. It is here to *pin* that default, so a future bun
# release cannot silently re-open the primitive the 2026-08-04 npm campaign
# used. Counterpart to ignore-scripts=true in ~/.npmrc, which npm needs
# because npm is the one package manager that still runs them by default.
#
# Escape hatch for a package that genuinely needs to build:
#   bun pm untrusted        # see what was skipped
#   bun pm trust <pkg>      # allow it, recorded in trustedDependencies

[install]
ignoreScripts = true

# Only install versions published more than 7 days ago (bun counts seconds), so
# a compromised release has time to be pulled before it lands here. Counterpart
# to min-release-age=7 in ~/.npmrc and minimumReleaseAge in the pnpm config.
#
# bun fails the install rather than quietly resolving to an older version, so
# the error names this setting. Per-package exemptions go in
# minimumReleaseAgeExcludes and are NOT transitive: exempting a package does not
# exempt its dependencies, so an exempted install can still fail further down.
# An existing bun.lock pins versions and is not re-checked against this.
minimumReleaseAge = 604800
