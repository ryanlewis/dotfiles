onboarding = false

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
# Close a workspace's last pane or tab without a confirmation prompt (0.9.4+)
confirm_close = false
status_indicators = "symbols"
# Tab row at the bottom, clear of the MacBook notch in full screen.
tab_bar_position = "bottom"
hide_tab_bar_when_single_tab = true

# Workspace rows: line 2 is $dir — the root pane's directory, reported by the
# Workspace Renamer plugin (io.rlew.workspace-renamer) for workspaces it has
# renamed, since a session-named label no longer says where you are. Line 3
# is $session — the agent's session name, reported by the same plugin for
# workspaces you named yourself. A workspace shows at most one of the two.
# Line 4 keeps the git info from the default layout. Workspaces without
# either token collapse those lines and render as before.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["$dir"],
  ["$session"],
  ["branch", "git_status"],
]

# Agent rows come from the io.rlew.agent-rows plugin (~/dev/herdr-agent-rows),
# which reports these $ar_* pane tokens on every agent state change:
#   $ar_name   workspace name (leads and solo agents)
#   $ar_git    branch or PR (#42, #42 merged), only off the default branch
#   $ar_state  "done 5m" / "blocked now" (empty while working);
#              a startup-hook ticker re-sweeps every 30s so it keeps moving
#   $ar_title  live terminal title, solo agents only, when it differs from
#              the workspace name
#   $ar_lgit / $ar_lstate  a team lead's branch and roll-up ("lead · 3
#              workers, 1 blocked"), on line 2 so a long lead name gets
#              line 1 to itself
#   $ar_wname / $ar_wgit / $ar_wstate  the same for a team worker, under
#              their own names so the whole worker row can be dimmed; the
#              name is indented with two U+2800 blanks (herdr trims spaces)
# Workers are one line and sit under their lead (agent_panel_sort "spaces"
# keeps workspace → tab → pane order). Roles come from the team-lead skill
# (role/lead pane tokens). Without the plugin the rows show only the icon.
# Colours: sidebar token styles take fixed hex only (no theme tokens, no
# light/dark variants), so names and titles carry no fg and follow the theme's
# text colour, and the meaning colours are mid shades that read on both Ayu
# dark and Catppuccin Latte: teal branch, blue open PR, mauve merged, red
# closed; green done, red+bold blocked, grey idle; lead roll-up mauve, peach
# with a blocked worker. Titles and worker rows are dimmed. Rules match the
# token's own text.
[ui.sidebar.agents]
rows = [
  ["state_icon",
   { token = "$ar_name", bold = true },
   { token = "$ar_git", fg = "#1a8f86", rules = [
     { contains = "merged", fg = "#8f5fd0" },
     { contains = "closed", fg = "#d43a50" },
     { starts_with = "#", fg = "#3a80c8" },
   ] },
   { token = "$ar_state", fg = "#7a7f8c", rules = [
     { starts_with = "blocked", fg = "#d43a50", bold = true },
     { starts_with = "done", fg = "#3f9634" },
   ] },
   { token = "$ar_wname", dim = true },
   { token = "$ar_wgit", dim = true, fg = "#1a8f86", rules = [
     { contains = "merged", fg = "#8f5fd0" },
     { contains = "closed", fg = "#d43a50" },
     { starts_with = "#", fg = "#3a80c8" },
   ] },
   { token = "$ar_wstate", dim = true, fg = "#7a7f8c", rules = [
     { starts_with = "blocked", fg = "#d43a50", bold = true },
     { starts_with = "done", fg = "#3f9634" },
   ] }],
  [{ token = "$ar_title", dim = true },
   { token = "$ar_lgit", fg = "#1a8f86", rules = [
     { contains = "merged", fg = "#8f5fd0" },
     { contains = "closed", fg = "#d43a50" },
     { starts_with = "#", fg = "#3a80c8" },
   ] },
   { token = "$ar_lstate", fg = "#8f5fd0", rules = [
     { contains = "blocked", fg = "#c96c25" },
   ] }],
]

# Matches Ghostty: Ayu when macOS is dark, Catppuccin Latte when light.
# Ayu is built from the catppuccin base with every token overridden below.
[theme]
name = "catppuccin"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

# Ayu Dark. Palette colours from Ghostty's Ayu theme; surfaces, overlays,
# subtext and selection from Ayu's editor palette.
[theme.custom.dark]
panel_bg      = "reset"          # keep Ghostty's translucent, blurred background
active_row_bg = "#131721"
selection_bg  = "#1c2633"
surface0      = "#131721"
surface1      = "#1c212b"
surface_dim   = "#0f131a"
overlay0      = "#565b66"
overlay1      = "#6c7380"
text          = "#bfbdb6"
subtext0      = "#8a8986"
accent        = "#3a8fc4"          # dimmed Ayu blue; also fills the active tab
mauve         = "#d2a6ff"
green         = "#aad94c"
yellow        = "#ffb454"
red           = "#f07178"
blue          = "#59c2ff"
teal          = "#95e6cb"
peach         = "#ff8f40"

[ui.sound]
enabled = false

[keys]
prefix = "ctrl+a"

# Workspaces own the number row (prefix = ctrl+a):
#   prefix + 1..9  or  cmd + 1..9  -> jump straight to workspace N
#   ctrl+shift + k/j  or  up/down  -> previous / next workspace = up / down the
#                                     vertical workspace stack (prefix-free)
# (Tabs get the shifted digits, cmd+shift+1..9, which Ghostty passes through;
#  prefix + w still opens the workspace picker.)
#
# Each action accepts EITHER a single chord string OR a TOML array of chords, so
# previous/next_workspace bind the vim keys AND the arrows at once (verified live:
# all four chords switch workspaces).
#
# Mnemonic: cmd+hjkl (or ctrl+hjkl) moves between PANES; ctrl+shift+j/k (or the arrows) moves
# between WORKSPACES (down/up the stack). ctrl+shift is the sweet spot -- neither
# modifier is remapped, so it's a clean left-hand chord AND left-Option compose
# (Opt+3 = #) is preserved, unlike ctrl+alt (which would need
# macos-option-as-alt = both). ctrl+shift+j stays distinct from the ctrl+j pane
# bind because herdr negotiates the Kitty keyboard protocol (crossterm
# PushKeyboardEnhancementFlags): ctrl+j already arrives as a CSI-u sequence and
# the shift modifier rides along. Verified distinct in practice.
switch_workspace = ["prefix+1..9", "cmd+1..9"]
previous_workspace = ["ctrl+shift+k", "ctrl+shift+up"]
next_workspace = ["ctrl+shift+j", "ctrl+shift+down"]

# Tabs gave the prefix number row to workspaces, so they cycle on n / p
# (and jump directly with cmd+shift+1..9, below):
#   prefix + p  or  cmd+shift+[ -> previous tab
#   prefix + n  or  cmd+shift+] -> next tab
#   prefix + , -> rename tab
previous_tab = ["prefix+p", "cmd+shift+["]
next_tab = ["prefix+n", "cmd+shift+]"]
rename_tab = "prefix+,"

# macOS-style cmd keys for the everyday actions (Ghostty's own tab/split/close
# binds for these are unbound so the chords reach herdr). Tabs and splits stay on
# the prefix too.
#   cmd+t            -> new tab
#   cmd+shift+1..9   -> jump straight to tab N
#   cmd+d            -> split right (side by side)
#   cmd+shift+d      -> split down (stacked)
#   cmd+w            -> close the focused pane
#   cmd+g            -> session navigator (goto)
#   cmd+n            -> new workspace
#   cmd+/ or cmd+shift+b -> toggle the sidebar
#   cmd+ctrl+r       -> resize mode (arrows / hjkl, esc to leave)
#   cmd+shift+enter  -> zoom the focused pane (toggle)
new_tab = ["prefix+c", "cmd+t"]
switch_tab = "cmd+shift+1..9"
split_vertical = ["prefix+v", "cmd+d"]
split_horizontal = ["prefix+minus", "cmd+shift+d"]
close_pane = ["prefix+x", "cmd+w"]
goto = ["prefix+g", "cmd+g"]
new_workspace = ["prefix+shift+n", "cmd+n"]
toggle_sidebar = ["prefix+b", "cmd+shift+b", "cmd+/"]
resize_mode = ["prefix+r", "cmd+ctrl+r"]
zoom = ["prefix+z", "cmd+shift+enter"]

# Direct (prefix-free) vim-style pane focus on cmd+h/j/k/l and ctrl+h/j/k/l.
# cmd+hjkl never reaches apps in a pane anyway, so it costs nothing (Ghostty's
# cmd+j/k binds are unbound, and Hide Ghostty is moved off cmd+h in macOS App
# Shortcuts). These are global
# binds, so herdr swallows the chord before the focused app sees it — chosen
# because the collisions are cheap here:
#   ctrl+h  backspace  -> real Backspace sends ^? (DEL), so it still works
#   ctrl+j  LF/newline -> Claude Code newline is Shift+Enter for us, not ctrl+j
#                         (universal fallback if ever needed: \ + Enter)
#   ctrl+k  unbound in both Claude Code and our zsh (self-insert) -> free
#   ctrl+l  clear/redraw -> minor; `clear` / Claude Code redraw is cosmetic
# (No ctrl+arrow aliases here: macOS grabs ctrl+left/right for Spaces and
#  ctrl+up/down for Mission Control / Exposé, so they never reach herdr.
#  ctrl+shift+arrow survives the OS, which is why workspaces use it.)
# (prefix+h/j/k/l no longer focuses panes; the navigate/resize modes still do.)
focus_pane_left = ["cmd+h", "ctrl+h"]
focus_pane_down = ["cmd+j", "ctrl+j"]
focus_pane_up = ["cmd+k", "ctrl+k"]
focus_pane_right = ["cmd+l", "ctrl+l"]

# Open lazygit in a temporary pane (closes when lazygit exits)
[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"
description = "lazygit"

# Layout Tools (io.rlew.layout) — equalize / rotate / picker.
# equalize/rotate are type="shell": detached, no visible pane; they act on the
# tab you're focused on. The picker is the plugin's popup card grid — no
# --placement here, so the manifest's popup (sized 80%x70%) wins; passing
# --placement overlay would override it back to a fullscreen zoomed overlay.
#   prefix + =      -> snap panes to equal area (lossless)
#   prefix + space  -> popup card grid of equalise + rotate
# (prefix + r is deliberately left unbound so it falls through to herdr's
#  built-in resize mode; rotate now lives only in the prefix+space picker.)
[[keys.command]]
key = "prefix+="
type = "shell"
command = "~/dev/herdr-layout-tools/bin/layout-tools equalize"
description = "equalise panes"

[[keys.command]]
key = "prefix+space"
type = "shell"
command = "herdr plugin pane open --plugin io.rlew.layout --entrypoint picker"
description = "layout picker"

[experimental]
kitty_graphics = true

# Command palette (vjeantet.palette, installed with `herdr plugin install
# vjeantet/herdr-palette`): fuzzy picker over herdr's built-in operations,
# every installed plugin's action, and the palette's own user commands.
#   cmd+p -> open the palette
[[keys.command]]
key = "cmd+p"
type = "plugin_action"
command = "vjeantet.palette.open"
description = "Command palette"

# Fingers (nathan-poncet.herdr-fingers): hint every URL, path or SHA in the
# pane. Type a hint to open, Shift+hint to paste, Ctrl+hint to copy (swapped
# in the plugin config).
[[keys.command]]
key = ["prefix+f", "cmd+o"]
type = "plugin_action"
command = "nathan-poncet.herdr-fingers.start"
description = "open with hints"
