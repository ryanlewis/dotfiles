# Worktrunk user config.
# NOTE: kept as a plain (non-.tmpl) file — the {{ ... }} below are Worktrunk
# template variables, not chezmoi ones, and must reach Worktrunk untouched.

# Create worktrees inside the repo under .worktrees/
worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

# LLM-generated commit messages during `wt merge`
[commit.generation]
command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

# Always show CI status and diffstats
[list]
full = true
# Pin the JSON output schema — a future release flips the default to 2.
json-schema = 2

# Trust any mise config in a freshly created worktree. pre-start blocks until
# done, so it completes before any --execute command (e.g. crpr's `claude`).
# `mise trust -a` is a no-op (exit 0) when there's no config, so it's safe to
# run on every worktree, not just PR reviews.
[pre-start]
mise-trust = "mise trust -a"

# `wt tidy` — one-shot cleanup of worktrees whose work has landed on main.
# Fetch first: prune measures against origin/main, so a stale remote ref makes
# it miss branches that merged since the last fetch.
[[aliases.tidy]]
fetch = "git fetch --prune"

[[aliases.tidy]]
prune = "wt step prune {{ args }}"

# prune silently skips worktrees with uncommitted changes and has no --force,
# so a merged worktree holding a stray build artefact would otherwise linger
# unreported. List them with the integration check that matched.
[[aliases.tidy]]
report = '''
skipped=$(wt list --format json | jq -r '
  .items[]
  | select(.worktree != null and .worktree.main == false)
  | select(.default_branch.integration != null)
  | select(.worktree.changes | (.staged or .modified or .untracked or .renamed or .deleted or .conflicted))
  | "  \(.branch)  (\(.default_branch.integration.reason))  \(.worktree.path)"
')
if [ -n "$skipped" ]; then
  printf '\n▲ merged but dirty — prune skips these, use: wt remove -f <branch>\n%s\n' "$skipped"
fi
'''
